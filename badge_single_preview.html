<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>员工工牌预览</title>
<style>

/* A4 页面 */
.a4-page {
  position: relative;
  width: 210mm;
  height: 297mm;
  background: #f0f0f0;
  box-sizing: border-box;
  overflow: hidden;
}
/* 工牌容器 */
.card-wrap {
  position: absolute;
  width: 96mm;
  height: 55mm;
  overflow: hidden;
  box-shadow: 0 0 0 0.3mm #c0c0c0;
}
/* 工牌内所有子元素均绝对定位 */
.card-wrap * {
  box-sizing: border-box;
}
/* 角标（占位，实际样式均用 inline style）*/
.badge-box {
  position: absolute;
  left: 2.930mm; top: 1.867mm;
  width: 10.263mm; height: 10.263mm;
  background: white;
  border-radius: 1.900mm;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
/* 品牌文字 */
.brand-cn {
  position: absolute;
  left: 14.5mm; top: 2.3mm;
  font-size: 4.2mm;
  font-weight: 700;
  color: white;
  white-space: nowrap;
  letter-spacing: 0.2mm;
  font-family: "Noto Sans SC", "Source Han Sans CN", "Microsoft YaHei", sans-serif;
}
.brand-en {
  position: absolute;
  left: 14.5mm; top: 8.2mm;
  font-size: 2.0mm;
  font-weight: 600;
  color: rgba(255,255,255,0.90);
  white-space: nowrap;
  letter-spacing: 0.15mm;
  font-family: Arial, Helvetica, sans-serif;
}
/* 星星暗色背景 */
.star-bg {
  position: absolute;
  top: 11.107mm;
  width: 14.584mm; height: 14.000mm;
  background: #1b1918;
}
/* 星星图片 */
.star-img {
  position: absolute;
  top: 12.722mm;
  width: 11.354mm; height: 10.770mm;
  object-fit: contain;
}
.star-fallback {
  position: absolute;
  top: 12.722mm;
  width: 11.354mm; height: 10.770mm;
  display: flex; align-items: center; justify-content: center;
  font-size: 8mm;
  color: #FFD700;
}
/* 照片占位 */
.photo-box {
  position: absolute;
  left: 5.100mm; top: 16.550mm;
  width: 23.540mm; height: 32.950mm;
  background: #f8f8f8;
  border: 0.3mm solid #cccccc;
  overflow: hidden;
}
.photo-box img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.photo-placeholder {
  position: relative;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.photo-placeholder svg {
  position: absolute;
  width: 100%; height: 100%;
  top: 0; left: 0;
}
.photo-label {
  position: relative;
  z-index: 1;
  font-size: 2.8mm;
  color: #888;
  letter-spacing: 0.5mm;
  margin-top: 2mm;
  font-family: "Microsoft YaHei", sans-serif;
}
/* 角色标签（工牌角标）*/
.role-badge {
  position: absolute;
  left: 2.930mm; top: 13.200mm;
  width: 10.262mm;
  background: #b60814;
  border-radius: 0 0 1.5mm 1.5mm;
  text-align: center;
  padding: 0.4mm 0;
}
.role-cn {
  display: block;
  font-size: 2.5mm;
  font-weight: 700;
  color: white;
  font-family: "Microsoft YaHei", sans-serif;
  line-height: 1.3;
}
.role-en {
  display: block;
  font-size: 1.5mm;
  color: rgba(255,255,255,0.85);
  font-family: Arial, sans-serif;
  line-height: 1.2;
  letter-spacing: 0.1mm;
}
/* 文字字段 */
.field-label {
  position: absolute;
  left: 35.150mm;
  font-size: 3.0mm;
  font-weight: 600;
  color: #1b1918;
  font-family: "Microsoft YaHei", sans-serif;
  white-space: nowrap;
}
.field-value {
  position: absolute;
  left: 43.270mm; width: 23.260mm;
  font-size: 3.0mm;
  color: #1b1918;
  font-family: "Microsoft YaHei", sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.field-ul {
  position: absolute;
  left: 43.270mm; width: 23.260mm;
  height: 0;
  border-bottom: 0.3mm solid #888;
}
/* QR 码 */
.qr-box {
  position: absolute;
  left: 69.880mm; top: 28.020mm;
  width: 20.040mm; height: 20.040mm;
  overflow: hidden;
  border: 0.2mm solid #bbb;
  background: white;
}
.qr-box img {
  width: 100%; height: 100%;
  object-fit: contain;
}
.qr-placeholder {
  width: 100%; height: 100%;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.qr-placeholder svg {
  position: absolute;
  width: 100%; height: 100%;
  top: 0; left: 0;
}
.qr-label {
  position: absolute;
  left: 69.880mm;
  top: 50.000mm;
  width: 20.040mm;
  text-align: center;
  font-size: 2.2mm;
  color: #555;
  font-family: "Microsoft YaHei", sans-serif;
}
/* 底部红条 */
.card-foot {
  position: absolute;
  left: 0; top: 52.138mm;
  width: 96mm; height: 2.862mm;
  background: #e50036;
}
/* 水印 */
.watermark {
  position: absolute;
  left: 0; top: 0;
  width: 96mm; height: 55mm;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 50;
}
.watermark-text {
  font-size: 28mm;
  font-weight: 900;
  color: rgba(255,0,0,0.08);
  transform: rotate(-30deg);
  white-space: nowrap;
  font-family: "Microsoft YaHei", sans-serif;
  user-select: none;
}
/* 打印 */
@media print {
  body { margin: 0; }
  .a4-page { box-shadow: none; background: white; }
  .card-wrap { box-shadow: none; }
  .watermark-text { color: rgba(255,0,0,0.06); }
}

body { background: #e0e0e0; display: flex; align-items: center; justify-content: center;
       min-height: 100vh; margin: 0; }
</style>
</head>
