<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<style>

:root {
  --brand-red:   #e50036;
  --gold:        #D4AF37;
  --gold-dark:   #B8860B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6}

/* ──── 单张工牌 ──── */
.card{
  width:96mm;height:55mm;
  background:white;
  border:0.3mm solid #d0d0d0;
  border-radius:1.2mm;
  overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
  font-size:0;
}

/* 顶栏 */
.card-header{
  background:var(--brand-red);
  height:9.5mm;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 2mm;
}
.role-badge{
  background:white;border-radius:1mm;
  width:9mm;height:7.5mm;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  margin-right:2mm;
}
.role-badge span{
  color:var(--brand-red);font-size:2.4mm;font-weight:700;
  text-align:center;line-height:1.2;display:block;
}
.brand-section{flex:1;display:flex;flex-direction:column;justify-content:center}
.brand-cn{color:white;font-size:3.8mm;font-weight:700;line-height:1.25}
.brand-en-row{display:flex;align-items:center;gap:0.8mm;margin-top:0.3mm}
.brand-icon{
  width:3mm;height:3mm;background:white;border-radius:0.3mm;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.brand-en{color:white;font-size:1.9mm;line-height:1}
.pill-group{display:flex;flex-direction:column;gap:1mm;margin-right:1mm}
.pill{width:6.5mm;height:2.8mm;border-radius:1.4mm}
.pill-w{background:white}
.pill-r{background:#ff3355;border:0.3mm solid white}

/* 底条 */
.card-footer{background:var(--brand-red);height:1.2mm;flex-shrink:0}

/* 主体 */
.card-body{
  flex:1;display:flex;
  padding:2.8mm 2.8mm 2mm 2.8mm;
  gap:3mm;overflow:hidden;
}

/* 照片 */
.photo-wrap{
  width:25mm;height:35mm;flex-shrink:0;
  border:0.3mm solid #c8c8c8;
  background:#f5f5f5;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.photo-xline{
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom right,transparent calc(50% - 0.3mm),#c8c8c8 50%,transparent calc(50% + 0.3mm)),
    linear-gradient(to bottom left, transparent calc(50% - 0.3mm),#c8c8c8 50%,transparent calc(50% + 0.3mm));
}
.photo-label{
  position:relative;z-index:1;
  color:#BBBBBB;font-size:2.8mm;
}

/* 内容区 */
.content-area{flex:1;display:flex;flex-direction:column;min-width:0}

/* 五星 */
.stars-row{
  display:flex;gap:0.55mm;
  margin-top:2mm;margin-bottom:3.5mm;
  align-self:flex-start;
}
.star{
  color:var(--gold);font-size:5.2mm;line-height:1;
  text-shadow:0 0 0.8mm var(--gold-dark);
}

/* 字段 */
.field{
  display:flex;align-items:flex-end;
  border-bottom:0.3mm solid #333;
  padding-bottom:0.5mm;margin-bottom:1mm;
}
.field-lbl{color:#1a1a1a;font-size:3.4mm;white-space:nowrap;flex-shrink:0}
.field-val{color:#1a1a1a;font-size:3.4mm;flex:1;min-width:0}

/* 二维码 */
.qr-wrap{
  width:13mm;flex-shrink:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.qr-box{
  width:13mm;height:13mm;
  border:0.3mm solid #c0c0c0;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.qr-box img{width:100%;height:100%;object-fit:contain;display:block}
.qr-lbl{color:#aaa;font-size:2.2mm;margin-top:0.5mm;text-align:center}

/* 水印 */
.watermark{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:34mm;font-weight:900;
  color:rgba(210,210,210,0.07);
  pointer-events:none;user-select:none;z-index:0;
}

/* ──── A4 拼版 ──── */
.a4-page{
  width:210mm;height:297mm;
  background:white;
  display:grid;
  grid-template-columns:repeat(2,96mm);
  grid-template-rows:repeat(5,55mm);
  padding:2mm 5mm;
  column-gap:8mm;
  row-gap:3.4mm;
}

/* ──── 屏幕预览比例 ──── */
@media screen{
  .preview-scale{
    transform-origin:top left;
    transform:scale(2.0);
  }
}
@media print{
  body{background:white}
  .no-print{display:none!important}
}

body{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;background:#888}
@media print{body{background:white;padding:0;gap:0}}
</style>
